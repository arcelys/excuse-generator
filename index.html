<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Генератор оправданий</title>
  </head>
  <body class="bg-gradient-to-br from-[#cbc5ff] to-white min-h-screen flex items-center justify-center">
    <main class="text-center px-4 max-w-xl w-full">
      <h1 class="text-3xl font-bold mb-6">Генератор оправданий</h1>
      <select id="category-select" class="p-2 border rounded mb-4">
        <option value="">Выберите категорию</option>
      </select>
      <button id="generateBtn" class="bg-[#bab2ff] hover:bg-[#9b90fa] text-black px-6 py-3 rounded-2xl shadow-lg transition">
        Сгенерировать
      </button>
      <p id="excuse" class="mt-6 text-xl max-w-xl text-black bg-[#cdcef8] p-4 rounded-xl cursor-pointer hover:bg-[#b5b6ff] transition hidden"></p>
      <p id="copyMsg" class="mt-2 text-[#188118] font-medium"></p>
    </main>
    
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
